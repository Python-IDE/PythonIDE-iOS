<body>
  <a class="skip-link" href="#main" data-en="Skip to content">跳到正文</a>
  <div class="page">
    <header class="site-header">
      <nav class="nav" aria-label="PythonIDE" data-label-en="PythonIDE navigation">
        <a class="brand" href="/" aria-label="PythonIDE 首页" data-label-en="PythonIDE home"><img class="brand-mark" src="/assets/brand-mark.svg?v=e15a28ac8e15" alt=""><span>PythonIDE</span></a>
        <div class="nav-links" data-nav-links data-open="false">
          <a class="nav-link" href="/" data-en="Overview">概览</a>
          <a class="nav-link" href="/showcase/" aria-current="page" data-en="Showcase">网站广场</a>

        </div>
        <div class="nav-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="切换深色模式"></button>
          <div class="language-toggle" aria-label="语言 / Language"><button type="button" data-lang="zh" aria-pressed="true">中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>

    </header>

    <main class="main showcase" id="main" data-showcase data-feed="https://website-api.pythonide.xin/v1/public/showcase">
      <div class="shell">
        <div class="showcase-heading">
          <div>
            <h1 class="section-title" data-en="Website Showcase">网站广场</h1>
            <p class="section-copy" data-en="Explore websites published with PythonIDE.">浏览用 PythonIDE 发布的网站。</p>
          </div>
          <form class="showcase-search" role="search" data-showcase-search hidden>
            <label class="showcase-visually-hidden" for="showcase-query" data-en="Website name or domain">网站名称或域名</label>
            <input id="showcase-query" type="search" name="q" maxlength="80" placeholder="名称或域名" autocomplete="off" dir="auto">
            <button class="button" type="submit" data-en="Search">搜索</button>
          </form>
        </div>

        <div class="showcase-toolbar">
          <h2 id="showcase-list-title">
            <span data-showcase-latest data-en="Latest websites">最新发布</span>
            <span data-showcase-results data-en="Search results" hidden>搜索结果</span>
          </h2>
          <a class="showcase-guide" href="/website/" data-en="How to publish ↗">如何部署 ↗</a>
        </div>

        <ul class="showcase-grid" aria-labelledby="showcase-list-title" data-showcase-list></ul>
        <div class="showcase-status" role="status" data-showcase-status>
          <p data-state="loading" data-en="Loading websites…" hidden>正在加载网站…</p>
          <p data-state="loading-more" data-en="Loading more websites…" hidden>正在加载更多网站…</p>
          <p data-state="empty" data-en="No websites are listed yet." hidden>暂时还没有网站上架。</p>
          <p data-state="no-results" data-en="No websites match your search." hidden>没有找到匹配的网站。</p>
          <p data-state="error" data-en="The website list could not load." hidden>网站列表暂时无法加载。</p>
          <p data-state="page-error" data-en="More websites could not load." hidden>暂时无法加载更多网站。</p>
          <noscript>请启用 JavaScript 浏览网站广场。 Enable JavaScript to browse the showcase.</noscript>
        </div>
        <div class="showcase-actions">
          <button class="button" type="button" data-showcase-more data-en="Load more" hidden>加载更多</button>
          <button class="button" type="button" data-showcase-retry data-en="Try again" hidden>重试</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell">
        <div class="footer-bottom showcase-footer">
          <a class="brand" href="/"><img class="brand-mark" src="/assets/brand-mark.svg?v=e15a28ac8e15" alt=""><span>PythonIDE</span></a>
          <div class="showcase-footer-links">
            <a href="/website/" data-en="Website deployment">部署网站</a>
            <a href="/privacy/" data-en="Privacy policy">隐私政策</a>
            <a href="/support/" data-en="Help and support">帮助与支持</a>
          </div>
          <span>© 2026 PythonIDE</span>
        </div>
      </div>
    </footer>
  </div>

  <template id="showcase-site">
    <li class="showcase-card">
      <a class="showcase-site-link" data-site-link>
        <div class="showcase-cover" aria-hidden="true">
          <span class="showcase-initial" data-site-initial></span>
          <img width="640" height="400" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="">
        </div>
        <div class="showcase-card-body">
          <div class="showcase-card-text">
            <h3 data-site-name dir="auto"></h3>
            <span class="showcase-domain" data-site-domain dir="ltr"></span>
          </div>
          <span class="showcase-arrow" aria-hidden="true">↗</span>
        </div>
      </a>
    </li>
  </template>
